name: Windows VST3

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.13
        shell: pwsh
        run: git clone --depth 1 --branch 8.0.13 https://github.com/juce-framework/JUCE.git work/deps/JUCE

      - name: Fetch Musashi
        shell: pwsh
        run: |
          git init work/deps/Musashi
          git -C work/deps/Musashi remote add origin https://github.com/kstenerud/Musashi.git
          git -C work/deps/Musashi fetch --depth 1 origin 313ebf1bd9f4d0d93341eb5ce21fd8a119e9dbdd
          git -C work/deps/Musashi checkout --detach FETCH_HEAD

      - name: Configure
        run: cmake -S . -B work/windows-vst3-build -G "Visual Studio 17 2022" -A x64 -DEPS16_BUILD_VST3=ON -DEPS16_JUCE_DIR="${{ github.workspace }}/work/deps/JUCE"

      - name: Build and run Windows machine-start test
        run: |
          cmake --build work/windows-vst3-build --config Release --target eps16_vst3_editor_smoke_test eps16_oex_routing_test eps16_midi_snapshot_test --parallel
          ctest --test-dir work/windows-vst3-build -C Release -R "vst3_synthetic_machine_start|vst3_oex_routing|vst3_midi_snapshot" --output-on-failure

      - name: Build and package
        run: cmake --build work/windows-vst3-build --config Release --target eps16_vst3_package --parallel

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: Ensoniq-EPS-16-Plus-Windows-x64
          path: work/windows-vst3-build/vst3-package/Ensoniq-EPS-16-Plus-*-Windows-x64.zip
          if-no-files-found: error
